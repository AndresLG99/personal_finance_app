<script>
// Si la app no termina de cargar (conexión lenta/inestable, p. ej. datos
// móviles), después de 12s mostramos un mensaje claro con botón de reintentar
// en vez de dejar la pantalla en negro indefinidamente sin explicación.
(function(){
  setTimeout(function(){
    var el=document.getElementById('s-insights');
    if(el&&!el.childElementCount){
      var msg=document.createElement('div');
      msg.id='boot-fallback';
      msg.setAttribute('role','alert');
      msg.style.cssText='position:fixed;inset:0;z-index:999;background:#0C0D12;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;font:15px system-ui,sans-serif';
      msg.innerHTML='<strong style="font-size:18px">No se pudo cargar la app</strong><span style="color:#9A9BA6;max-width:280px">Está tardando más de lo normal. Revisa tu conexión a internet e inténtalo de nuevo.</span><button id="reload-fallback" style="background:#FF7A45;color:#1A0E08;border:none;border-radius:14px;padding:12px 24px;font-weight:700;font-size:15px">Reintentar</button>';
      document.body.appendChild(msg);
      document.getElementById('reload-fallback').onclick=function(){location.reload();};
    }
  },12000);
})();
</script>
